<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>Simple E-Commerce Store</h1>

    <div class="product">
        <h2>Headphones</h2>
        <p>Price: ₹999</p>
        <button onclick="addToCart()">Add to Cart</button>
    </div>

    <div class="cart">
        <h3>Cart Items: <span id="count">0</span></h3>
    </div>

</div>

<script src="script.js"></script>

</body>
</html>
